<!-- =========================================================================
     /paid — Page Settings → Custom Code → HEAD  (replace the whole slot)
     ---------------------------------------------------------------------
     multi-step.js and every raw `$(document).ready(...)` block must NOT
     live here: jQuery loads mid-body on this site, so head copies throw
     "$ is not defined" — and a failed head copy of multi-step.js leaves
     its top-level `let` bindings behind, which kills every later footer
     copy with "Identifier has already been declared". That combination is
     what broke the quiz and the FAQ see-more link.

     The lp-paid A/B test (old vs new page build) ENDED Oct 2026; the
     OLD build (.page-wrapper.cc-paid-old) stays as the live page. Its
     pre-paint assignment script is gone from this slot. Site CSS already
     ships the old build visible / new hidden; the small <style> below
     pins that so a Designer CSS change or a stale localStorage pin can
     never swap builds. The footer slot (paid.html) then removes the hidden
     new build from the DOM before loading multi-step.js. Delete
     .page-wrapper.cc-paid-new in the Designer when convenient — the
     <style> is harmless once that's done. The lp-paid experiment in the
     Statsig console must stay PAUSED / carry no inject actions.
========================================================================== -->

<!-- ===== Pin the old build pre-paint (keep FIRST in this slot) =====
     Belt and braces over the site CSS default (old visible / new hidden):
     no JS, so no flash and no dependency on localStorage pins left over
     from the lp-paid test. Remove together with .page-wrapper.cc-paid-new
     once it is deleted in the Designer. -->
<style>
  .page-wrapper.cc-paid-new { display: none !important; }
  .page-wrapper.cc-paid-old { display: block !important; }
</style>
