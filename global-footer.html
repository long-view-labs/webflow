     GLOBAL FOOTER — LOADER STUB
     Paste into Webflow Site Settings -> Custom Code -> Footer.

     This stub should almost never change. All footer logic lives in
     footer.js in the GitHub repo (github.com/long-view-labs/webflow),
     served via jsDelivr. To ship a footer change: merge the PR, tag a
     release, then bump ONLY the version in the footer.js script URL below.

     What stays inline here (and why):
     - Apex detection: everything downstream reads window.__nourish_apex.
     - Statsig sidecar owner flags: must exist before the sidecar callback.
     - RudderStack stub: queues page() at parse time. LOADS EAGERLY — do not
       defer without data-team sign-off (Aug 2026 incident: deferring lost
       Viewed Page events for quick-bounce visitors).
     - LinkedIn <noscript> pixel: noscript can't live in an external file.
============================================================================ -->

<script>
  window.__nourishStatsig = window.__nourishStatsig || {};
  window.__nourishStatsig.homepageExperimentOwner = "sidecar";
  window.__nourishStatsig.sidecarExperimentIds =
    window.__nourishStatsig.sidecarExperimentIds || [];

  // Apex detection must run before any snippet that reads __nourish_apex
  // (Rudderstack below, footer.js, global.js helpers).
  (function () {
    var h = window.location.hostname;
    window.__nourish_apex = h.includes("usenourish.com")
      ? "usenourish.com"
      : h.includes("nourish.com")
        ? "nourish.com"
        : "usenourish.com";
  })();
</script>

<!--Rudderstack-->
<script async defer type="text/javascript">
  !(function () {
    var e = (window.rudderanalytics = window.rudderanalytics || []);
    e.methods = [
      "load",
      "page",
      "track",
      "identify",
      "alias",
      "group",
      "ready",
      "reset",
      "getAnonymousId",
      "setAnonymousId",
      "getUserId",
      "getUserTraits",
      "getGroupId",
      "getGroupTraits",
      "startSession",
      "endSession",
      "getSessionId",
    ];
    e.factory = function (t) {
      return function () {
        e.push([t].concat(Array.prototype.slice.call(arguments)));
      };
    };
    for (var t = 0; t < e.methods.length; t++) {
      var r = e.methods[t];
      e[r] = e.factory(r);
    }
    e.loadJS = function () {
      var t = document.createElement("script");
      ((t.type = "text/javascript"),
        (t.async = !0),
        (t.src =
          "https://jssdk-proxy." +
          (window.__nourish_apex || "usenourish.com") +
          "/v3/modern/rsa.min.js"));
      var r = document.getElementsByTagName("script")[0];
      r.parentNode.insertBefore(t, r);
    };
    // IMPORTANT: Rudderstack loads eagerly — the SDK download starts at
    // footer parse so Viewed Page counts match historical behavior. Do NOT
    // defer this without sign-off from the data team (deferring loses page
    // views from quick-bounce visitors; see the Aug 2026 incident).
    (e.loadJS(),
      e.load(
        "2aOoUzHccHpDljomHWiSCOqQAv5",
        "https://dataplane-proxy." +
          (window.__nourish_apex || "usenourish.com"),
        {
          consentManagement: {
            enabled: true,
            provider: "oneTrust",
          },
        },
      ),
      e.page());
  })();
</script>
